<!DOCTYPE html>
<html lang="id">
<head>
    <title>Belajar membuat form</title>

    <!-- Menghubungkan HTML dengan CSS eksternal -->
     <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="container">
        <h1>Formulir Data Mahasiswa</h1>
        <p class="subtitle">Silakan isi formulir di bawah ini:</p>
        
    <form action="#"
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="jurusan">Program Studi:</label>
        <select id="jurusan" name="jurusan" required>
            <option value="Pilih">Pilih Program Studi</option>
            <option value="Teknologi Informasi">Teknik Informatika</option>
            <option value="Ilmu Komputer">Sistem Informasi</option>
        </select required><br><br>

        <label for="jenis_kelamin">Jenis Kelamin:</label>
        <input type="radio" id="laki-laki" name="jenis_kelamin" value="Laki-laki" required>
        <label for="laki-laki">Laki-laki</label>
        <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan" required>
        <label for="perempuan">Perempuan</label><br><br>

        <label for="alamat">Alamat:</label>
        <textarea id="alamat" name="alamat" rows="4" cols="50" required></textarea><br><br>

        <label>Hobi</label>
        <dataset id="hobi" name="hobi" required>
            <input type="checkbox" id="Akademik" name="hobi" value="Akademik">
            <label for="Akademik">Akademik</label>
            <input type="checkbox" id="olahraga" name="hobi" value="Olahraga">
            <label for="olahraga">Olahraga</label>
            <input type="checkbox" id="seni" name="hobi" value="Seni">
            <label for="seni">Seni</label>

     <input type="submit" value="Kirim" name="btn-submit">
        <button type="reset" value="Reset">Reset</button>
    </form>
</body>
</html>
